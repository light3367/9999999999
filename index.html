<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青岛城市学院快递代取</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei";
}

body{
  min-height:100vh;
  color:#fff;
  padding-bottom:110px;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 10%, rgba(56,189,248,0.35), transparent 26%),
    radial-gradient(circle at 80% 20%, rgba(99,102,241,0.35), transparent 28%),
    #0b1736;
}

/* 顶部栏 */
.header{
  margin:14px;
  padding:16px 20px;
  border-radius:28px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(26px);
  -webkit-backdrop-filter:blur(26px);
  border:1px solid rgba(255,255,255,0.18);
  font-size:20px;
  font-weight:600;
}

/* 列表容器 */
.container{
  padding:10px 14px;
}

/* 液态玻璃卡片 */
.item-card{
  position:relative;
  padding:18px 20px;
  margin:12px 0;
  border-radius:26px;
  background:rgba(255,255,255,0.11);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.17);
  display:flex;
  align-items:center;
  gap:16px;
  overflow:hidden;
}

.item-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:50%;
  height:50%;
  background:linear-gradient(135deg, rgba(255,255,255,0.25), transparent 60%);
  pointer-events:none;
}

/* 彩色快递图标，纯CSS实现，无外部图片 */
.express-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  font-size:14px;
  flex-shrink:0;
  position:relative;
  z-index:1;
  box-shadow:
    0 8px 20px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.4),
    inset 0 -1px 0 rgba(0,0,0,0.15);
}

.icon-zto{ background:linear-gradient(145deg,#0066b3,#004a85); }
.icon-yto{ background:linear-gradient(145deg,#ff6a00,#d45400); }
.icon-jt{ background:linear-gradient(145deg,#ff3b30,#c1272d); }
.icon-yunda{ background:linear-gradient(145deg,#0095ff,#006bbd); }
.icon-sto{ background:linear-gradient(145deg,#0044aa,#002f7a); }
.icon-jd{ background:linear-gradient(145deg,#ff0000,#c7000b); }

.item-text{
  flex:1;
  position:relative;
  z-index:1;
}
.item-name{
  font-size:17px;
  font-weight:600;
}
.item-desc{
  font-size:13px;
  opacity:0.7;
  margin-top:3px;
}

/* 底部导航 */
.bottom-nav{
  position:fixed;
  bottom:16px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-evenly;
  padding:14px;
  border-radius:30px;
  background:rgba(255,255,255,0.13);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,0.19);
  z-index:99;
}

.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:13px;
  cursor:pointer;
  padding:6px 0;
  border-radius:16px;
  position:relative;
  overflow:hidden;
  transition:background 0.2s ease, transform 0.2s ease;
}

.nav-item .nav-icon{
  width:44px;
  height:44px;
  border-radius:16px;
  background:rgba(255,255,255,0.16);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  border:1px solid rgba(255,255,255,0.2);
  transition:box-shadow 0.2s ease, background 0.2s ease, transform 0.2s ease;
}

/* 点击亮光效果 */
.nav-item:active{
  background:rgba(56,189,248,0.25);
}
.nav-item:active .nav-icon{
  background:rgba(56,189,248,0.45);
  box-shadow:
    0 0 0 4px rgba(56,189,248,0.25),
    0 0 22px rgba(56,189,248,0.55),
    inset 0 0 12px rgba(255,255,255,0.6);
  transform:scale(0.94);
}

/* 弹窗 */
.mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:200;
}
.popup{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  width:86%;
  max-width:340px;
  transform:translate(-50%,-50%);
  padding:28px 24px;
  border-radius:30px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.26);
  text-align:center;
  z-index:201;
}
.popup-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  margin:10px 0;
  border-radius:18px;
  background:rgba(255,255,255,0.12);
}
.copy{
  padding:7px 12px;
  border-radius:12px;
  border:none;
  background:#38bdf8;
  color:#fff;
}
.close-btn{
  margin-top:16px;
  width:100%;
  padding:13px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,0.20);
  color:#fff;
  font-size:15px;
}
</style>
</head>
<body>

<div class="header">学院快递信息站</div>

<div class="container">
  <div class="item-card">
    <div class="express-icon icon-zto">中通</div>
    <div class="item-text">
      <div class="item-name">中通快递</div>
      <div class="item-desc">支持代取服务</div>
    </div>
  </div>

  <div class="item-card">
    <div class="express-icon icon-yto">圆通</div>
    <div class="item-text">
      <div class="item-name">圆通快递</div>
      <div class="item-desc">支持代取服务</div>
    </div>
  </div>

  <div
